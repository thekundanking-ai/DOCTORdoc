services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doctordoc
      POSTGRES_PASSWORD: doctordoc
      POSTGRES_DB: doctordoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://doctordoc:doctordoc@db:5432/doctordoc
      FRONTEND_ORIGIN: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-52428800}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-7}
      GNANI_API_KEY: ${GNANI_API_KEY:-}
      GNANI_API_BASE_URL: ${GNANI_API_BASE_URL:-https://api.vachana.ai}
      GNANI_STT_MODEL: ${GNANI_STT_MODEL:-prisma-v3.0}
      GNANI_LANGUAGE_CODE: ${GNANI_LANGUAGE_CODE:-indic-auto}
      GNANI_STT_FORMAT: ${GNANI_STT_FORMAT:-transcribe}
      GNANI_POLL_INTERVAL_SECONDS: ${GNANI_POLL_INTERVAL_SECONDS:-15}
      MERCURY_API_KEY: ${MERCURY_API_KEY:-}
      MERCURY_BASE_URL: ${MERCURY_BASE_URL:-https://api.inceptionlabs.ai}
      MERCURY_MODEL: ${MERCURY_MODEL:-mercury-3}
      MERCURY_TIMEOUT_SECONDS: ${MERCURY_TIMEOUT_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
