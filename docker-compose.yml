services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doctordoc
      POSTGRES_PASSWORD: doctordoc
      POSTGRES_DB: doctordoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://doctordoc:doctordoc@db:5432/doctordoc
      FRONTEND_ORIGIN: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
